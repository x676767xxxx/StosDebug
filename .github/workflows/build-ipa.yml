name: Build StosDebug IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Build
        run: |
          xcodebuild \
            -project StosDebug.xcodeproj \
            -scheme StosDebug \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Debug-iphoneos/StosDebug.app Payload/
          zip -r StosDebug.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StosDebug-IPA
          path: StosDebug.ipa
